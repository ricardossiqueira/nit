github:
  default_base_branch: "master"
  use_gh_cli: true

model:
  provider: "ollama"
  model_name: "deepseek-v2"
  endpoint: "http://localhost:11434/api/chat"
  max_tokens: 2048
  temperature: 0.2
  timeout_seconds: 60

pr_style:
  language: "en"
  title:
    pattern: "[{type}] {scope}: {summary}"
    allowed_types: ["feat", "fix", "chore", "refactor", "docs"]
    max_length: 72
  description_sections:
    - name: "Context"
      required: true
    - name: "Changes"
      required: true
    - name: "Impact"
      required: false
    - name: "Tests"
      required: true
  coverage_checklist:
    - "Explains the reason for the change"
    - "Lists the main changes"
    - "Mentions affected modules"
    - "Indicates impact or risks"
    - "Describes how to test"

review:
  focus: ["bugs", "legibility", "style"]
  python_version: "3.11"
  style_guide: "pep8"
  max_diff_lines: 800
